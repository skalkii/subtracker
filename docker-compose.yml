services:
  postgres:
    image: postgres:16-alpine
    container_name: subtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subtracker
      POSTGRES_PASSWORD: subtracker
      POSTGRES_DB: subtracker
    ports:
      - "5432:5432"
    volumes:
      - subtracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtracker -d subtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subtracker_pgdata:
